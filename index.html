<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1118">
  <title>이미지 자동 정리</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root{
      --bg:#0b1118;--bg-soft:#0f1722;--panel:#131d29;--panel-2:#182432;--panel-3:#202d3b;
      --text:#edf4f7;--muted:#91a0ad;--faint:#657382;--line:#2a3947;--line-strong:#3b4c5b;
      --accent:#2ec7a6;--accent-strong:#16a085;--accent-soft:#143e39;--yellow:#f3c84b;
      --danger:#ff7c81;--shadow:0 16px 44px #0006;--cell:#111a23;
    }
    :root[data-theme="light"]{
      --bg:#f3f5f2;--bg-soft:#eaf5f1;--panel:#fff;--panel-2:#f7f9f7;--panel-3:#edf1ee;
      --text:#17202a;--muted:#68727d;--faint:#89938e;--line:#d8ded9;--line-strong:#bdc8c1;
      --accent:#16a085;--accent-strong:#0d745f;--accent-soft:#e7f7f2;--yellow:#e7b92d;
      --danger:#d6535b;--shadow:0 16px 44px #23322e18;--cell:#e9ede9;
    }
    *{box-sizing:border-box}
    html{color-scheme:dark}
    html[data-theme="light"]{color-scheme:light}
    body{margin:0;background:radial-gradient(circle at 10% -10%,var(--accent-soft),transparent 34rem),var(--bg);color:var(--text);font-family:Arial,"Apple SD Gothic Neo",sans-serif;transition:background .2s,color .2s}
    button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;-webkit-tap-highlight-color:transparent}button:disabled,input:disabled,textarea:disabled,select:disabled{cursor:wait;opacity:.5}
    main{min-height:100vh;padding:22px clamp(14px,3vw,44px) 92px}
    .topbar,.workspace,.grid-tools,.grid-shell,.notice{width:min(100%,1600px);margin-inline:auto}
    .topbar{display:flex;align-items:center;gap:14px;margin-bottom:14px}.brand{display:flex;align-items:center;gap:12px;min-width:0}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,var(--accent),var(--accent-strong));color:#061813;font-weight:1000;font-size:18px;box-shadow:0 8px 26px #16a08545}.title{min-width:0}.eyebrow{margin:0 0 2px;color:var(--accent);font-size:10px;font-weight:900;letter-spacing:.16em}.title h1{margin:0;font-size:clamp(21px,3vw,30px);letter-spacing:-.045em;white-space:nowrap}.top-meta{margin-left:auto;display:flex;align-items:center;gap:8px}.privacy{padding:8px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:11px;font-weight:700}.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);font-size:17px}
    .workspace{border:1px solid var(--line);border-radius:18px;background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:var(--shadow);overflow:hidden}
    .actionbar{display:flex;align-items:center;gap:8px;padding:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
    .btn{min-height:42px;border:0;border-radius:11px;padding:0 15px;font-weight:850}.primary{background:var(--accent);color:#071b16}.secondary{border:1px solid var(--line-strong);background:var(--panel-2)}.ghost{background:var(--panel-3);color:var(--muted)}.save{background:var(--text);color:var(--bg)}.danger:hover{color:var(--danger)}.move-on{background:var(--yellow)!important;color:#312607!important;border-color:transparent!important}
    .count{display:flex;align-items:baseline;gap:3px;padding:0 5px;color:var(--muted);white-space:nowrap}.count strong{color:var(--text);font-size:18px}.spacer{flex:1}.field{height:42px;border:1px solid var(--line-strong);border-radius:11px;background:var(--panel-2);padding:0 11px;outline:0}.field:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}.zipname{width:160px}.zipmode{max-width:178px}
    .axes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}.axis-field{min-width:0}.field-head{display:flex;align-items:center;gap:7px;margin:0 0 6px 2px}.field-head b{font-size:13px}.badge{padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:10px;font-weight:900}.field-head small{margin-left:auto;color:var(--faint);font-size:10px}
    textarea.axis-input{display:block;width:100%;min-height:0;resize:none;overflow-x:auto;overflow-y:hidden;white-space:pre;wrap:off;border:1px solid var(--line);border-radius:11px;background:var(--panel-2);padding:8px 10px 5px;line-height:22px;outline:0;scrollbar-gutter:stable;transition:height .12s ease}
    textarea.axis-input::-webkit-scrollbar{width:10px;height:10px}textarea.axis-input::-webkit-scrollbar-track{background:var(--panel-3);border-radius:8px}textarea.axis-input::-webkit-scrollbar-thumb{background:var(--line-strong);border:2px solid var(--panel-3);border-radius:8px}
    .advanced{border-top:1px solid var(--line)}.advanced summary{display:flex;align-items:center;gap:8px;padding:9px 13px;color:var(--muted);font-size:12px;font-weight:800;cursor:pointer;list-style:none}.advanced summary::-webkit-details-marker{display:none}.advanced summary::before{content:'›';font-size:18px;line-height:1;transition:transform .15s}.advanced[open] summary::before{transform:rotate(90deg)}.summary-value{margin-left:auto;color:var(--accent)}.export{display:flex;align-items:center;gap:12px;padding:4px 13px 12px;flex-wrap:wrap}.export label{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:750}.quality{display:flex;align-items:center;gap:7px}.quality input{width:120px;accent-color:var(--accent)}.quality output{min-width:30px;font-weight:900}.format-note{color:var(--muted);font-size:11px}
    .progress{display:none;width:min(100%,1600px);height:5px;margin:8px auto 0;overflow:hidden;border-radius:999px;background:var(--panel-3)}.progress.on{display:block}.progress i{display:block;width:0;height:100%;background:var(--accent);transition:width .12s}
    .grid-tools{position:sticky;top:8px;z-index:20;display:flex;align-items:center;gap:7px;margin-top:12px;margin-bottom:7px;padding:7px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--panel) 90%,transparent);box-shadow:0 8px 24px #0003;backdrop-filter:blur(14px)}.grid-tools .btn{min-height:38px;padding:0 12px}.zoom{display:flex;align-items:center;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--panel-2);overflow:hidden}.zoom button{width:38px;height:100%;border:0;background:transparent;font-size:18px}.zoom button:active{background:var(--panel-3)}.zoom output{min-width:56px;text-align:center;font-size:12px;font-weight:900}.hint{margin-left:auto;color:var(--faint);font-size:10px;white-space:nowrap}
    .grid-shell{display:grid;grid-template-columns:minmax(0,1fr) 38px;grid-template-rows:minmax(390px,calc(100vh - 305px)) 38px;min-height:466px}.gridwrap{grid-column:1;grid-row:1;overflow:auto;border:1px solid var(--line);border-radius:15px 0 0 0;background:var(--cell);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-color:var(--line-strong) var(--panel-3);scrollbar-width:auto}.gridwrap::-webkit-scrollbar{width:14px;height:14px}.gridwrap::-webkit-scrollbar-track{background:var(--panel-3)}.gridwrap::-webkit-scrollbar-thumb{background:var(--line-strong);border:3px solid var(--panel-3);border-radius:10px}.matrix{display:grid;width:max-content;gap:1px;background:var(--line)}
    .corner,.chead,.rhead{position:sticky;z-index:4;display:flex;align-items:center;justify-content:center;background:var(--panel-2);font-size:12px;font-weight:850;text-align:center}.corner{top:0;left:0;z-index:6;color:var(--muted);font-size:9px}.chead{top:0;flex-direction:column}.rhead{left:0;z-index:5;flex-direction:column}.chead span,.rhead span{color:var(--accent);font-size:9px}.row{display:contents}.cell{position:relative;background:var(--cell);overflow:hidden;touch-action:pan-x pan-y}.gridwrap.moving .cell{touch-action:none}.card{width:100%;height:100%;user-select:none}.card img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.dragging{opacity:.45}.empty,.thumb-failed{display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:3px;color:var(--faint)}.empty strong{font-size:17px}.empty span{font-size:10px}.label{position:absolute;inset:auto 6px 6px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-radius:9px;background:#07100ddd;color:#fff;padding:5px 6px 5px 9px;backdrop-filter:blur(8px)}.label span{overflow:hidden;font-size:10px;font-weight:750;text-overflow:ellipsis;white-space:nowrap}.label button{width:25px;height:25px;border:0;border-radius:7px;background:#ffffff1f;color:#fff}
    .scroll-axis{display:flex;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line)}.axis-x{grid-column:1;grid-row:2;border-top:0;padding:0 11px;border-radius:0 0 0 15px}.axis-y{grid-column:2;grid-row:1;border-left:0;border-radius:0 15px 0 0}.axis-corner{grid-column:2;grid-row:2;border-left:0;border-top:0;border-radius:0 0 15px 0;color:var(--faint);font-size:9px}.scroll-axis input{accent-color:var(--accent)}.axis-x input{width:100%}.axis-y input{width:calc(100vh - 350px);min-width:350px;max-width:720px;transform:rotate(90deg)}
    .notice{min-height:20px;margin-top:8px;color:var(--muted);font-size:11px}.mobile-save{display:none}
    @media(max-width:760px){
      main{padding:13px 10px 82px}.topbar{margin-bottom:9px}.logo{width:38px;height:38px}.eyebrow,.privacy{display:none}.title h1{font-size:21px}.actionbar{padding:9px;gap:7px}.btn{min-height:40px;padding:0 11px}.count{order:3}.zipname{width:135px}.zipmode{max-width:155px}.spacer{display:none}.actionbar .save{display:none}.axes{grid-template-columns:1fr;padding:9px}.field-head small{display:none}.grid-tools{top:5px;margin-top:9px;overflow-x:auto;flex-wrap:nowrap}.grid-tools .hint{display:none}.grid-tools .ghost{white-space:nowrap}.grid-shell{grid-template-rows:minmax(390px,calc(100vh - 260px)) 38px;min-height:466px}.axis-y input{width:calc(100vh - 305px);min-width:350px}.mobile-save{position:fixed;z-index:40;right:12px;bottom:12px;left:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--panel) 92%,transparent);padding:8px 8px 8px 12px;box-shadow:0 14px 40px #0008;backdrop-filter:blur(14px)}.mobile-save span{overflow:hidden;color:var(--muted);font-size:10px;text-overflow:ellipsis;white-space:nowrap}.mobile-save .btn{flex:none;background:var(--accent);color:#071b16}}
  </style>
</head>
<body>
<main>
  <header class="topbar">
    <div class="brand"><div class="logo">IO</div><div class="title"><p class="eyebrow">IMAGE ORGANIZER</p><h1>이미지 자동 정리</h1></div></div>
    <div class="top-meta"><span class="privacy">이미지는 기기 안에서만 처리됨</span><button class="icon-btn" id="themeToggle" type="button" aria-label="테마 변경">☀︎</button></div>
  </header>

  <section class="workspace">
    <div class="actionbar">
      <input id="gallery" type="file" accept="image/*" multiple hidden><input id="files" type="file" accept="image/*" multiple hidden>
      <button class="btn primary" data-open="gallery">사진·갤러리</button><button class="btn secondary" data-open="files">파일 선택</button>
      <div class="count"><strong id="filled">0</strong><span>/</span><span id="total">9</span><span>장</span></div>
      <input class="field zipname" id="zipName" value="이미지_정리" aria-label="ZIP 파일 이름">
      <select class="field zipmode" id="zipMode" aria-label="ZIP 저장 방식"><option value="safe">안전 분할 · 250MB</option><option value="single">한 ZIP으로 저장</option></select>
      <div class="spacer"></div><button class="btn ghost danger" id="clear">전체 비우기</button><button class="btn save" data-save>ZIP 저장</button>
    </div>

    <div class="axes">
      <label class="axis-field"><span class="field-head"><b>분류 · 캐릭터명</b><span class="badge" id="catCount">3개</span><small>가로축</small></span><textarea class="axis-input" id="categories" wrap="off" rows="3">캐릭터 1
캐릭터 2
캐릭터 3</textarea></label>
      <label class="axis-field"><span class="field-head"><b>상황</b><span class="badge" id="sitCount">3개</span><small>세로축</small></span><textarea class="axis-input" id="situations" wrap="off" rows="3">기본
기쁨
화남</textarea></label>
    </div>

    <details class="advanced">
      <summary>저장 세부 설정 <span class="summary-value" id="exportSummary">WebP · 품질 90</span></summary>
      <div class="export"><label>저장 형식 <select class="field" id="format"><option value="original">원본 유지</option><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp" selected>WebP</option></select></label><label class="quality" id="qualityBox">품질 <input id="quality" type="range" min="50" max="100" value="90"><output id="qualityValue">90</output></label><span class="format-note" id="formatNote">WebP 90 · 웹사이트용 추천</span></div>
    </details>
  </section>

  <div class="progress" id="progress"><i></i></div>

  <section class="grid-tools">
    <button class="btn secondary" id="moveMode" type="button">이미지 이동: 꺼짐</button>
    <div class="zoom"><button id="zoomOut" type="button" aria-label="축소">−</button><output id="zoomLabel">100%</output><button id="zoomIn" type="button" aria-label="확대">＋</button></div>
    <button class="btn ghost" id="zoomReset" type="button">100%로</button><span class="hint">이동 꺼짐: 표 스크롤 · 이동 켜짐: 이미지 자리 교환</span>
  </section>

  <section class="grid-shell">
    <div class="gridwrap" id="gridwrap"><div class="matrix" id="matrix"></div></div>
    <label class="scroll-axis axis-x" aria-label="가로 위치"><input id="xScroll" type="range" min="0" max="1000" value="0"></label>
    <label class="scroll-axis axis-y" aria-label="세로 위치"><input id="yScroll" type="range" min="0" max="1000" value="0"></label>
    <div class="scroll-axis axis-corner">X·Y</div>
  </section>
  <p class="notice" id="notice">분류와 상황을 입력하고 이미지를 추가해봐.</p>
  <div class="mobile-save"><span id="mobileNotice">이미지를 추가해봐.</span><button class="btn" data-save>ZIP 저장</button></div>
</main>

<script>
  const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
  const state={images:[],drag:null,busy:false,moveMode:false,zoom:1};
  const THUMB_SIZE=320,ZIP_PART_BYTES=250*1024*1024;
  const parse=v=>v.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
  const safe=v=>v.replace(/[\\/:*?"<>|]/g,"_").replace(/\s+/g," ").trim()||"미지정";
  const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
  const lists=()=>({cats:parse($('#categories').value),sits:parse($('#situations').value)});
  const say=t=>{$('#notice').textContent=t;$('#mobileNotice').textContent=t};
  const pause=ms=>new Promise(r=>setTimeout(r,ms));

  function setTheme(theme){document.documentElement.dataset.theme=theme;document.documentElement.style.colorScheme=theme;$('#themeToggle').textContent=theme==='dark'?'☀︎':'☾';document.querySelector('meta[name="theme-color"]').content=theme==='dark'?'#0b1118':'#f3f5f2';try{localStorage.setItem('image-organizer-theme',theme)}catch{}}
  function initTheme(){let theme='dark';try{theme=localStorage.getItem('image-organizer-theme')||'dark'}catch{}setTheme(theme)}
  function fitTextarea(el){const lines=Math.max(1,el.value.split('\n').length),rows=Math.min(3,lines);el.rows=rows;el.style.height=`${rows*22+24}px`;el.style.overflowY=lines>3?'auto':'hidden'}
  function updateAxisUI(){const{cats,sits}=lists();$('#catCount').textContent=`${cats.length}개`;$('#sitCount').textContent=`${sits.length}개`;fitTextarea($('#categories'));fitTextarea($('#situations'))}
  function progress(v){const b=$('#progress'),i=b.querySelector('i');b.classList.toggle('on',v!==null);i.style.width=`${Math.max(0,Math.min(100,v||0))}%`}
  function busy(on){state.busy=on;$$('button,input,textarea,select').forEach(e=>e.disabled=on)}
  function release(x){if(x?.thumbUrl)URL.revokeObjectURL(x.thumbUrl)}
  function swap(a,b){if(state.busy||a===b||a<0||b<0)return;[state.images[a],state.images[b]]=[state.images[b]||null,state.images[a]||null];render();requestAnimationFrame(syncAxes)}

  function render(){
    const{cats,sits}=lists(),count=cats.length*sits.length,g=$('#matrix'),cell=Math.round(190*state.zoom),head=Math.max(82,Math.round(108*state.zoom));
    $('#total').textContent=count;$('#filled').textContent=state.images.slice(0,count).filter(Boolean).length;
    g.style.gridTemplateColumns=`${head}px repeat(${cats.length},${cell}px)`;
    g.innerHTML=`<div class="corner">상황 ↓ / 분류 →</div>`+cats.map((x,i)=>`<div class="chead"><span>${i}, x</span>${esc(x)}</div>`).join('');
    sits.forEach((sit,y)=>g.insertAdjacentHTML('beforeend',`<div class="row"><div class="rhead"><span>y, ${y}</span>${esc(sit)}</div>`+cats.map((cat,x)=>{const i=y*cats.length+x,it=state.images[i];return `<div class="cell" data-i="${i}" style="width:${cell}px;height:${cell}px">${it?`<div class="card" draggable="${state.moveMode}" data-i="${i}">${it.thumbUrl?`<img src="${it.thumbUrl}" alt="">`:`<div class="thumb-failed">미리보기 없음</div>`}<div class="label"><span>${esc(cat)}_${esc(sit)}</span><button data-remove="${i}" aria-label="이미지 제거">×</button></div></div>`:`<div class="empty"><strong>${x},${y}</strong><span>빈칸</span></div>`}</div>`}).join('')+`</div>`));
    $$('.chead').forEach(e=>e.style.width=`${cell}px`);$$('.rhead').forEach(e=>e.style.minHeight=`${cell}px`);bindGrid()
  }

  function bindGrid(){
    $$('.card').forEach(c=>{
      c.ondragstart=e=>{if(!state.moveMode){e.preventDefault();return}state.drag=+c.dataset.i;e.dataTransfer.setData('text/plain',state.drag);c.closest('.cell').classList.add('dragging')};
      c.ondragend=()=>{state.drag=null;render()};
      c.onpointerdown=e=>{if(state.moveMode&&e.pointerType!=='mouse'&&!e.target.closest('button')){state.drag=+c.dataset.i;c.setPointerCapture(e.pointerId);c.closest('.cell').classList.add('dragging')}};
      c.onpointerup=e=>{if(state.moveMode&&e.pointerType!=='mouse'&&state.drag!==null){const from=state.drag,cell=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell'),to=cell?+cell.dataset.i:-1;state.drag=null;to>=0&&to!==from?swap(from,to):render()}};
      c.onpointercancel=()=>{state.drag=null;render()};
    });
    $$('.cell').forEach(c=>{c.ondragover=e=>{if(state.moveMode)e.preventDefault()};c.ondrop=e=>{if(state.moveMode){e.preventDefault();swap(+e.dataTransfer.getData('text/plain'),+c.dataset.i)}}});
    $$('[data-remove]').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.remove;release(state.images[i]);state.images[i]=null;render()})
  }

  async function makeThumbnail(file){
    const src=URL.createObjectURL(file),img=new Image();
    try{img.src=src;await img.decode();const r=Math.min(1,THUMB_SIZE/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*r)),h=Math.max(1,Math.round(img.naturalHeight*r)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.72));c.width=c.height=1;return blob?URL.createObjectURL(blob):null}catch{return null}finally{img.src='';URL.revokeObjectURL(src)}
  }

  async function add(input){
    if(state.busy)return;const{cats,sits}=lists(),count=cats.length*sits.length,chosen=[...input.files].filter(f=>f.type.startsWith('image/'));input.value='';const slots=[];for(let i=0;i<count;i++)if(!state.images[i])slots.push(i);const accepted=chosen.slice(0,slots.length);if(!accepted.length)return say(chosen.length?'빈칸이 없어.':'이미지 파일을 찾지 못했어.');busy(true);progress(0);let done=0;for(let n=0;n<accepted.length;n++){state.images[slots[n]]={file:accepted[n],thumbUrl:await makeThumbnail(accepted[n])};done++;progress(done/accepted.length*100);say(`${accepted.length}장 중 ${done}장 준비 중...`);if(done%10===0){render();await pause(0)}}busy(false);progress(null);render();say(`${done}장을 순서대로 배치했어.`)
  }

  function baseItems(){const{cats,sits}=lists(),count=cats.length*sits.length,used={};return state.images.slice(0,count).map((it,i)=>{if(!it)return null;const x=i%cats.length,y=Math.floor(i/cats.length),base=`${safe(cats[x])}_${safe(sits[y])}`,n=used[base]=(used[base]||0)+1;return{file:it.file,base:`${base}${n>1?`_${n}`:''}`}}).filter(Boolean)}
  function extOriginal(f){return f.name.includes('.')?f.name.split('.').pop().toLowerCase():(f.type.split('/').pop()||'png')}
  async function convert(item){const fmt=$('#format').value;if(fmt==='original')return{file:item.file,name:`${item.base}.${extOriginal(item.file)}`};const mime=fmt==='png'?'image/png':fmt==='jpeg'?'image/jpeg':'image/webp',ext=fmt==='jpeg'?'jpg':fmt,q=+$('#quality').value/100,src=URL.createObjectURL(item.file),img=new Image();try{img.src=src;await img.decode();const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const ctx=c.getContext('2d');if(fmt==='jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height)}ctx.drawImage(img,0,0);const blob=await new Promise(ok=>c.toBlob(ok,mime,fmt==='png'?undefined:q));c.width=c.height=1;if(!blob)throw Error('convert');return{file:blob,name:`${item.base}.${ext}`}}finally{img.src='';URL.revokeObjectURL(src)}}
  function splitParts(items){if($('#zipMode').value==='single')return[items];const parts=[];let p=[],bytes=0;for(const it of items){if(p.length&&bytes+it.file.size>ZIP_PART_BYTES){parts.push(p);p=[];bytes=0}p.push(it);bytes+=it.file.size}if(p.length)parts.push(p);return parts}
  function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),15000)}

  async function save(){
    if(state.busy)return;const raw=baseItems();if(!raw.length)return say('저장할 이미지가 없어.');if(!window.JSZip)return say('압축 기능을 불러오지 못했어.');busy(true);progress(0);
    try{const items=[];for(let i=0;i<raw.length;i++){say(`이미지 변환 중... ${i+1}/${raw.length}`);items.push(await convert(raw[i]));progress((i+1)/raw.length*45);await pause(0)}const parts=splitParts(items),zipName=safe($('#zipName').value||'이미지_정리');for(let p=0;p<parts.length;p++){say(parts.length>1?`ZIP ${p+1}/${parts.length} 만드는 중...`:'ZIP 만드는 중...');const zip=new JSZip();for(const it of parts[p])zip.file(it.name,it.file,{binary:true,compression:'STORE'});const blob=await zip.generateAsync({type:'blob',compression:'STORE',streamFiles:true},m=>progress(45+55*((p+m.percent/100)/parts.length)));download(blob,`${zipName}${parts.length>1?`_${String(p+1).padStart(2,'0')}`:''}.zip`);await pause(700)}say(`${items.length}장을 ${$('#format').selectedOptions[0].textContent} 형식으로 저장했어.`)}catch(e){console.error(e);say('변환/저장 중 오류가 났어. 너무 큰 이미지는 나눠서 시도해줘.')}finally{busy(false);progress(null);updateFormatUI()}
  }

  function syncAxes(){const b=$('#gridwrap'),xm=Math.max(0,b.scrollWidth-b.clientWidth),ym=Math.max(0,b.scrollHeight-b.clientHeight);$('#xScroll').value=xm?Math.round(b.scrollLeft/xm*1000):0;$('#yScroll').value=ym?Math.round(b.scrollTop/ym*1000):0}
  function setZoom(n){const b=$('#gridwrap'),xm=Math.max(0,b.scrollWidth-b.clientWidth),ym=Math.max(0,b.scrollHeight-b.clientHeight),rx=xm?b.scrollLeft/xm:0,ry=ym?b.scrollTop/ym:0;state.zoom=Math.max(.5,Math.min(1.5,Math.round(n*10)/10));$('#zoomLabel').textContent=`${Math.round(state.zoom*100)}%`;render();requestAnimationFrame(()=>{b.scrollLeft=rx*Math.max(0,b.scrollWidth-b.clientWidth);b.scrollTop=ry*Math.max(0,b.scrollHeight-b.clientHeight);syncAxes()})}
  function updateFormatUI(){const f=$('#format').value,q=$('#quality'),box=$('#qualityBox'),note=$('#formatNote'),summary=$('#exportSummary');box.style.opacity=(f==='jpeg'||f==='webp')?'1':'.45';q.disabled=state.busy||!(f==='jpeg'||f==='webp');$('#qualityValue').textContent=q.value;note.textContent=f==='webp'?`WebP ${q.value} · 웹사이트용 추천`:f==='jpeg'?`JPG ${q.value} · 작은 용량, 투명 배경은 흰색 처리`:f==='png'?'PNG · 무손실, 품질 설정 없음':'업로드한 원본 형식 그대로 저장';summary.textContent=f==='webp'?`WebP · 품질 ${q.value}`:f==='jpeg'?`JPG · 품질 ${q.value}`:f==='png'?'PNG · 무손실':'원본 유지'}

  $$('[data-open]').forEach(b=>b.onclick=()=>$('#'+b.dataset.open).click());
  $('#gallery').onchange=e=>add(e.target);$('#files').onchange=e=>add(e.target);
  $('#clear').onclick=()=>{if(state.busy)return;state.images.forEach(release);state.images=[];render();say('이미지를 전부 비웠어.')};
  $('#moveMode').onclick=()=>{state.moveMode=!state.moveMode;$('#gridwrap').classList.toggle('moving',state.moveMode);$('#moveMode').classList.toggle('move-on',state.moveMode);$('#moveMode').textContent=`이미지 이동: ${state.moveMode?'켜짐':'꺼짐'}`;render();say(state.moveMode?'이미지를 끌어서 자리를 바꿀 수 있어.':'표를 자유롭게 스크롤할 수 있어.')};
  $('#zoomOut').onclick=()=>setZoom(state.zoom-.1);$('#zoomIn').onclick=()=>setZoom(state.zoom+.1);$('#zoomReset').onclick=()=>setZoom(1);
  $('#gridwrap').onscroll=syncAxes;$('#xScroll').oninput=e=>{const b=$('#gridwrap');b.scrollLeft=(+e.target.value/1000)*Math.max(0,b.scrollWidth-b.clientWidth)};$('#yScroll').oninput=e=>{const b=$('#gridwrap');b.scrollTop=(+e.target.value/1000)*Math.max(0,b.scrollHeight-b.clientHeight)};
  $$('.axis-input').forEach(el=>el.oninput=()=>{fitTextarea(el);updateAxisUI();render();requestAnimationFrame(syncAxes)});
  $('#format').onchange=updateFormatUI;$('#quality').oninput=updateFormatUI;$$('[data-save]').forEach(b=>b.onclick=save);
  $('#themeToggle').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');window.addEventListener('resize',syncAxes);
  initTheme();updateAxisUI();render();updateFormatUI();requestAnimationFrame(syncAxes);
</script>
</body>
</html>
