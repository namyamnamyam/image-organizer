<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5f4ef"><title>이미지 자동 정리</title><script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script><style>
:root{--ink:#17202a;--muted:#68727d;--paper:#f5f4ef;--line:#dcded8;--mint:#16a085;--dark:#0d745f}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#e4f4ef 0,transparent 31rem),var(--paper);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled,input:disabled,select:disabled{opacity:.5}main{min-height:100vh;padding:36px clamp(18px,4vw,64px) 110px}header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;max-width:1600px;margin:0 auto 24px}.eyebrow{margin:0 0 8px;color:var(--dark);font-size:12px;font-weight:800;letter-spacing:.18em}h1{margin:0;font-size:clamp(32px,5vw,54px);letter-spacing:-.055em}.subtitle{color:var(--muted)}.privacy{border:1px solid #b9ddd3;border-radius:999px;background:#eaf8f4;color:#176c5a;padding:10px 14px;font-size:13px;font-weight:700}.toolbar,.editor,.export{max-width:1600px;margin:auto;border:1px solid var(--line);background:#ffffffe8;box-shadow:0 12px 40px #23322e12}.toolbar{display:flex;align-items:center;gap:10px;border-radius:20px 20px 0 0;padding:14px;flex-wrap:wrap}.btn{min-height:44px;border:0;border-radius:12px;padding:0 18px;font-weight:800}.primary{background:var(--mint);color:#fff}.secondary{border:1px solid #b9c4bf;background:#fff}.ghost{background:#eef0ed;color:#59625d}.save{background:var(--ink);color:#fff}.move-on{background:#f2c94c;color:#332b10}.count{color:var(--muted)}.count strong{color:var(--ink);font-size:18px}.spacer{flex:1}.field{height:44px;border:1px solid #b9c4bf;border-radius:12px;background:#fff;padding:0 12px;outline:0}.zipname{width:160px}.progress{display:none;max-width:1600px;height:7px;margin:10px auto 0;border-radius:999px;background:#dfe5e1;overflow:hidden}.progress.on{display:block}.progress i{display:block;height:100%;width:0;background:var(--mint)}.export{display:flex;align-items:center;gap:14px;padding:12px 18px;border-top:0;flex-wrap:wrap}.export label{displa :none}.card{width:100%;height:100%;user-select:none}.card img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none}.dragging{opacity:.45}.empty,.thumb-failed{display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;color:#adb3ad}.label{position:absolute;inset:auto 7px 7px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-radius:9px;background:#121a18d1;color:#fff;padding:6px 7px 6px 10px}.label span{overflow:hidden;font-size:10px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}.label button{width:25px;height:25px;border:0;border-radius:7px;background:#ffffff26;color:#fff}.axis{display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line)}.axis-x{grid-column:1;grid-row:2;border-top:0;padding:0 14px}.axis-y{grid-column:2;grid-row:1;border-left:0}.axis-corner{grid-column:2;grid-row:2}.axis input{accent-color:var(--mint)}.axis-x input{width:100%}.axis-y input{width:calc(72vh - 32px);transform:rotate(90deg)}.notice{max-width:1600px;margin:14px auto;color:var(--muted);font-size:13px}footer{display:none}@media(max-width:760px){main{padding:24px 14px 100px}header{align-items:flex-start;flex-direction:column}.toolbar .save,.spacer{display:none}.btn{padding:0 12px}.export{gap:10px}.editor{grid-template-columns:1fr}.guide{display:none}.hint{width:100%;margin-left:0}.grid-shell{grid-template-rows:minmax(360px,68vh) 42px}.axis-y input{width:calc(68vh - 32px)}footer{position:fixed;z-index:20;right:18px;bottom:18px;left:18px;display:flex;justify-content:space-between;align-items:center;border-radius:17px;background:#17202aea;color:#fff;padding:10px 10px 10px 16px}footer button{background:#f2c94c}}
</style></head><body><main><header><div><p class="eyebrow">IMAGE ORGANIZER</p><h1>이미지 자동 정리</h1><p class="subtitle">이미지를 배치하고 이름·형식을 바꿔 한 번에 저장해.</p></div><div class="privacy">모든 이미지 처리는 이 기기 안에서</div></header><section class="toolbar"><input id="gallery" type="file" accept="image/*" multiple hidden><input id="files" type="file" accept="image/*" multiple hidden><button class="btn primary" data-open="gallery">사진·갤러리</button><button class="btn secondary" data-open="files">파일 선택</button><div class="count"><strong id="filled">0</strong> / <span id="total">9</span>장</div><input class="field zipname" id="zipName" value="이미지_정리" aria-label="ZIP 파일 이름"><select class="field" id="zipMode"><option value="safe">안전 분할 · 250MB</option><option value="single">한 ZIP으로 저장</option></select><div class="spacer"></div><button class="btn ghost" id="clear">전체 비우기</button><button class="btn save" data-save>ZIP으로 저장</button></section><section class="export"><label>저장 형식 <select class="field" id="format"><option value="original">원본 유지</option><option value="png">PNG</option><option value="jpeg">JPG</option><option value="webp" selected>WebP</option></select></label><label class="quality" id="qualityBox">품질 <input id="quality" type="range" min="50" max="100" value="90"><output id="qualityValue">90</output></label><span class="format-note" id="formatNote">WebP 90 · 웹사이트용 추천</span></section><div class="progress" id="progress"><i></i></div><section class="editor"><label><b>분류 · 캐릭터명 (가로)</b><textarea id="categories">캐릭터 1
캐릭터 2
캐릭터 3</textarea><small>줄바꿈 또는 쉼표로 구분</small></label><label><b>상황 (세로)</b><textarea id="situations">기본
기쁨
화남</textarea><small>줄바꿈 또는 쉼표로 구분</small></label><div class="guide"><b>배치 순서</b><span>(0,0) → (1,0) → (2,0) → 다음 줄</span><span>PNG는 무손실이라 품질 설정을 사용하지 않아.</span><span>JPG·WebP는 품질을 조절할 수 있어.</span><span>대용량 ZIP은 250MB 단위로 나뉘어.</span></div></section><section class="viewbar"><button class="btn secondary" id="moveMode">이미지 이동: 꺼짐</button><div class="zoom"><button id="zoomOut">−</button><output id="zoomLabel">100%</output><button id="zoomIn">＋</button></div><button class="btn ghost" id="zoomReset">100%로</button><span class="hint">이동 꺼짐 = 표 스크롤 · 이동 켜짐 = 이미지 자리 교환</span></section><section class="grid-shell"><div class="gridwrap" id="gridwrap"><div class="matrix" id="matrix"></div></div><label class="axis axis-x"><input id="xScroll" type="range" min="0" max="1000" value="0"></label><label class="axis axis-y"><input id="yScroll" type="range" min="0" max="1000" value="0"></label><div class="axis axis-corner">X·Y</div></section><p class="notice" id="notice">분류와 상황을 입력하고 이미지를 추가해봐.</p><footer><span id="mobileNotice">이미지를 추가해봐.</span><button class="btn" data-save>저장</button></footer></main><script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);const state={images:[],drag:null,busy:false,moveMode:false,zoom:1};const THUMB_SIZE=320,ZIP_PART_BYTES=250*1024*1024;const parse=v=>v.split(/\n|,/).map(x=>x.trim()).filter(Boolean);const safe=v=>v.replace(/[\\/:*?"<>|]/g,"_").replace(/\s+/g," ").trim()||"미지정";const esc=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));const lists=()=>({cats:parse($('#categories').value),sits:parse($('#situations').value)});const say=t=>{$('#notice').textContent=t;$('#mobileNotice').textContent=t};const pause=ms=>new Promise(r=>setTimeout(r,ms));function progress(v){const b=$('#progress'),i=b.querySelector('i');b.classList.toggle('on',v!==null);i.style.width=`${Math.max(0,Math.min(100,v||0))}%`}function busy(on){state.busy=on;$$('button,input,textarea,select').forEach(e=>e.disabled=on)}function release(x){if(x?.thumbUrl)URL.revokeObjectURL(x.thumbUrl)}function swap(a,b){if(state.busy||a===b||a<0||b<0)return;[state.images[a],state.images[b]]=[state.images[b]||null,state.images[a]||null];render();requestAnimationFrame(syncAxes)}
function render(){const{cats,sits}=lists(),count=cats.length*sits.length,g=$('#matrix'),cell=Math.round(190*state.zoom),head=Math.max(82,Math.round(108*state.zoom));$('#total').textContent=count;$('#filled').textContent=state.images.slice(0,count).filter(Boolean).length;g.style.gridTemplateColumns=`${head}px repeat(${cats.length},${cell}px)`;g.innerHTML=`<div class="corner">상황 ↓ / 분류 →</div>`+cats.map((x,i)=>`<div class="chead"><span>${i}, x</span>${esc(x)}</div>`).join('');sits.forEach((sit,y)=>g.insertAdjacentHTML('beforeend',`<div class="row"><div class="rhead"><span>y, ${y}</span>${esc(sit)}</div>`+cats.map((cat,x)=>{const i=y*cats.length+x,it=state.images[i];return `<div class="cell" data-i="${i}" style="width:${cell}px;height:${cell}px">${it?`<div class="card" draggable="${state.moveMode}" data-i="${i}">${it.thumbUrl?`<img src="${it.thumbUrl}">`:`<div class="thumb-failed">미리보기 없음</div>`}<div class="label"><span>${esc(cat)}_${esc(sit)}</span><button data-remove="${i}">×</button></div></div>`:`<div class="empty"><strong>${x},${y}</strong><span>빈칸</span></div>`}</div>`}).join('')+`</div>`));$$('.chead').forEach(e=>e.style.width=`${cell}px`);$$('.rhead').forEach(e=>e.style.minHeight=`${cell}px`);bindGrid()}
function bindGrid(){$$('.card').forEach(c=>{c.ondragstart=e=>{if(!state.moveMode){e.preventDefault();return}state.drag=+c.dataset.i;e.dataTransfer.setData('text/plain',state.drag);c.closest('.cell').classList.add('dragging')};c.ondragend=()=>{state.drag=null;render()};c.onpointerdown=e=>{if(state.moveMode&&e.pointerType!=='mouse'&&!e.target.closest('button')){state.drag=+c.dataset.i;c.setPointerCapture(e.pointerId);c.closest('.cell').classList.add('dragging')}};c.onpointerup=e=>{if(state.moveMode&&e.pointerType!=='mouse'&&state.drag!==null){const from=state.drag,cell=document.elementFromPoint(e.clientX,e.clientY)?.closest('.cell'),to=cell?+cell.dataset.i:-1;state.drag=null;to>=0&&to!==from?swap(from,to):render()}}});$$('.cell').forEach(c=>{c.ondragover=e=>{if(state.moveMode)e.preventDefault()};c.ondrop=e=>{if(state.moveMode){e.preventDefault();swap(+e.dataTransfer.getData('text/plain'),+c.dataset.i)}}});$$('[data-remove]').forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.remove;release(state.images[i]);state.images[i]=null;render()})}
async function makeThumbnail(file){const src=URL.createObjectURL(file),img=new Image();try{img.src=src;await img.decode();const r=Math.min(1,THUMB_SIZE/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.max(1,Math.round(img.naturalWidth*r)),h=Math.max(1,Math.round(img.naturalHeight*r)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);const blob=await new Promise(ok=>c.toBlob(ok,'image/jpeg',.72));return blob?URL.createObjectURL(blob):null}catch{return null}finally{img.src='';URL.revokeObjectURL(src)}}async function add(input){if(state.busy)return;const{cats,sits}=lists(),count=cats.length*sits.length,chosen=[...input.files].filter(f=>f.type.startsWith('image/'));input.value='';const slots=[];for(let i=0;i<count;i++)if(!state.images[i])slots.push(i);const accepted=chosen.slice(0,slots.length);if(!accepted.length)return say(chosen.length?'빈칸이 없어.':'이미지 파일을 찾지 못했어.');busy(true);progress(0);let done=0;for(let n=0;n<accepted.length;n++){state.images[slots[n]]={file:accepted[n],thumbUrl:await makeThumbnail(accepted[n])};done++;progress(done/accepted.length*100);if(done%10===0)render()}busy(false);progress(null);render();say(`${done}장을 순서대로 배치했어.`)}
function baseItems(){const{cats,sits}=lists(),count=cats.length*sits.length,used={};return state.images.slice(0,count).map((it,i)=>{if(!it)return null;const x=i%cats.length,y=Math.floor(i/cats.length),base=`${safe(cats[x])}_${safe(sits[y])}`,n=used[base]=(used[base]||0)+1;return{file:it.file,base:`${base}${n>1?`_${n}`:''}`}}).filter(Boolean)}function extOriginal(f){return f.name.includes('.')?f.name.split('.').pop().toLowerCase():(f.type.split('/').pop()||'png')}async function convert(item){const fmt=$('#format').value;if(fmt==='original')return{file:item.file,name:`${item.base}.${extOriginal(item.file)}`};const mime=fmt==='png'?'image/png':fmt==='jpeg'?'image/jpeg':'image/webp',ext=fmt==='jpeg'?'jpg':fmt,q=+$('#quality').value/100,src=URL.createObjectURL(item.file),img=new Image();try{img.src=src;await img.decode();const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const ctx=c.getContext('2d');if(fmt==='jpeg'){ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height)}ctx.drawImage(img,0,0);const blob=await new Promise(ok=>c.toBlob(ok,mime,fmt==='png'?undefined:q));if(!blob)throw Error('convert');return{file:blob,name:`${item.base}.${ext}`}}finally{img.src='';URL.revokeObjectURL(src)}}function splitParts(items){if($('#zipMode').value==='single')return[items];const parts=[];let p=[],bytes=0;for(const it of items){if(p.length&&bytes+it.file.size>ZIP_PART_BYTES){parts.push(p);p=[];bytes=0}p.push(it);bytes+=it.file.size}if(p.length)parts.push(p);return parts}function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),15000)}async function save(){if(state.busy)return;const raw=baseItems();if(!raw.length)return say('저장할 이미지가 없어.');if(!window.JSZip)return say('압축 기능을 불러오지 못했어.');busy(true);progress(0);try{const items=[];for(let i=0;i<raw.length;i++){say(`이미지 변환 중... ${i+1}/${raw.length}`);items.push(await convert(raw[i]));progress((i+1)/raw.length*45);await pause(0)}const parts=splitParts(items),zipName=safe($('#zipName').value||'이미지_정리');for(let p=0;p<parts.length;p++){const zip=new JSZip();for(const it of parts[p])zip.file(it.name,it.file,{binary:true,compression:'STORE'});const blob=await zip.generateAsync({type:'blob',compression:'STORE',streamFiles:true},m=>progress(45+55*((p+m.percent/100)/parts.length)));download(blob,`${zipName}${parts.length>1?`_${String(p+1).padStart(2,'0')}`:''}.zip`);await pause(700)}say(`${items.length}장을 ${$('#format').selectedOptions[0].textContent} 형식으로 저장했어.`)}catch(e){console.error(e);say('변환/저장 중 오류가 났어. 너무 큰 이미지는 나눠서 시도해줘.')}finally{busy(false);progress(null);updateFormatUI()}}
function syncAxes(){const b=$('#gridwrap'),xm=Math.max(0,b.scrollWidth-b.clientWidth),ym=Math.max(0,b.scrollHeight-b.clientHeight);$('#xScroll').value=xm?Math.round(b.scrollLeft/xm*1000):0;$('#yScroll').value=ym?Math.round(b.scrollTop/ym*1000):0}function setZoom(n){state.zoom=Math.max(.5,Math.min(1.5,Math.round(n*10)/10));$('#zoomLabel').textContent=`${Math.round(state.zoom*100)}%`;render();requestAnimationFrame(syncAxes)}function updateFormatUI(){const f=$('#format').value,q=$('#quality'),box=$('#qualityBox'),note=$('#formatNote');box.style.opacity=(f==='jpeg'||f==='webp')?'1':'.45';q.disabled=state.busy||!(f==='jpeg'||f==='webp');$('#qualityValue').textContent=q.value;note.textContent=f==='webp'?`WebP ${q.value} · 웹사이트용 추천`:f==='jpeg'?`JPG ${q.value} · 작은 용량, 투명 배경은 흰색 처리` :f==='png'?'PNG · 무손실, 품질 설정 없음':'업로드한 원본 형식 그대로 저장'}
$$('[data-open]').forEach(b=>b.onclick=()=>$('#'+b.dataset.open).click());$('#gallery').onchange=e=>add(e.target);$('#files').onchange=e=>add(e.target);$('#clear').onclick=()=>{state.images.forEach(release);state.images=[];render();say('이미지를 전부 비웠어.')};$('#moveMode').onclick=()=>{state.moveMode=!state.moveMode;$('#gridwrap').classList.toggle('moving',state.moveMode);$('#moveMode').classList.toggle('move-on',state.moveMode);$('#moveMode').textContent=`이미지 이동: ${state.moveMode?'켜짐':'꺼짐'}`;render()};$('#zoomOut').onclick=()=>setZoom(state.zoom-.1);$('#zoomIn').onclick=()=>setZoom(state.zoom+.1);$('#zoomReset').onclick=()=>setZoom(1);$('#gridwrap').onscroll=syncAxes;$('#xScroll').oninput=e=>{const b=$('#gridwrap');b.scrollLeft=(+e.target.value/1000)*Math.max(0,b.scrollWidth-b.clientWidth)};$('#yScroll').oninput=e=>{const b=$('#gridwrap');b.scrollTop=(+e.target.value/1000)*Math.max(0,b.scrollHeight-b.clientHeight)};$('#categories').oninput=render;$('#situations').oninput=render;$('#format').onchange=updateFormatUI;$('#quality').oninput=updateFormatUI;$$('[data-save]').forEach(b=>b.onclick=save);window.addEventListener('resize',syncAxes);render();updateFormatUI();requestAnimationFrame(syncAxes);
</script></body></html>
