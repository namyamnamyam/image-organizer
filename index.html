<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>이미지 자동 정리</title>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root{--ink:#17202a;--muted:#68727d;--paper:#f5f4ef;--line:#dcded8;--mint:#16a085;--dark:#0d745f}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#e4f4ef 0,transparent 31rem),var(--paper);color:var(--ink);font-family:Arial,"Apple SD Gothic Neo",sans-serif}
    button,textarea{font:inherit}button{-webkit-tap-highlight-color:transparent;cursor:pointer}main{min-height:100vh;padding:36px clamp(18px,4vw,64px) 110px}
    header{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;max-width:1600px;margin:0 auto 24px}.eyebrow{margin:0 0 8px;color:var(--dark);font-size:12px;font-weight:800;letter-spacing:.18em}
    h1{margin:0;font-size:clamp(32px,5vw,54px);letter-spacing:-.055em;line-height:1}.subtitle{margin:14px 0 0;color:var(--muted)}.privacy{flex:none;border:1px solid #b9ddd3;border-radius:999px;background:#eaf8f4;color:#176c5a;padding:10px 14px;font-size:13px;font-weight:700}
    .toolbar,.editor{max-width:1600px;margin:auto;border:1px solid var(--line);background:#ffffffe8;box-shadow:0 12px 40px #23322e12}.toolbar{display:flex;align-items:center;gap:10px;border-radius:20px 20px 0 0;padding:14px}
    .btn{min-height:44px;border:0;border-radius:12px;padding:0 18px;font-weight:800}.primary{background:var(--mint);color:#fff}.secondary{border:1px solid #b9c4bf;background:#fff}.ghost{background:#eef0ed;color:#59625d}.save{background:var(--ink);color:#fff}.count{margin-left:4px;color:var(--muted);font-size:14px}.count strong{color:var(--ink);font-size:18px}.spacer{flex:1}
    .editor{display:grid;grid-template-columns:1fr 1fr minmax(220px,.7fr);gap:18px;border-top:0;border-radius:0 0 20px 20px;padding:18px}.editor label{display:flex;min-width:0;flex-direction:column;gap:8px}.editor b,.guide b{font-size:14px}.editor small,.guide span{color:var(--muted);font-size:12px}
    textarea{min-height:96px;resize:vertical;border:1px solid var(--line);border-radius:12px;outline:0;padding:12px;background:#fbfcfa;line-height:1.5}textarea:focus{border-color:var(--mint);box-shadow:0 0 0 3px #16a0851f}.guide{display:flex;flex-direction:column;gap:9px;border-radius:14px;background:#f2f0e7;padding:14px}
    .gridwrap{max-width:1600px;margin:24px auto 0;overflow:auto;border:1px solid var(--line);border-radius:18px;background:#e4e6e1;box-shadow:0 18px 55px #23322e17}.matrix{display:grid;width:max-content;gap:1px}.corner,.chead,.rhead{position:sticky;z-index:4;display:flex;min-height:64px;align-items:center;justify-content:center;background:#f7f7f3;font-size:13px;font-weight:800;text-align:center}.corner{top:0;left:0;z-index:6;padding:8px;color:var(--muted);font-size:10px}.chead{top:0;flex-direction:column;gap:5px;width:190px;padding:10px}.rhead{left:0;z-index:5;flex-direction:column;gap:5px;min-height:190px;padding:8px}.chead span,.rhead span{color:var(--dark);font-size:10px}.row{display:contents}
    .cell{position:relative;width:190px;height:190px;background:#eceeea;overflow:hidden;touch-action:none}.cell.dragging{opacity:.45}.empty{display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:5px;color:#adb3ad}.empty strong{font-size:18px}.empty span{font-size:11px}.card{width:100%;height:100%;cursor:grab;user-select:none}.card img{display:block;width:100%;height:100%;pointer-events:none;object-fit:contain}.label{position:absolute;inset:auto 7px 7px;display:flex;align-items:center;justify-content:space-between;gap:6px;border-radius:9px;background:#121a18d1;color:#fff;padding:6px 7px 6px 10px;backdrop-filter:blur(8px)}.label span{overflow:hidden;font-size:10px;font-weight:700;text-overflow:ellipsis;white-space:nowrap}.label button{flex:none;width:25px;height:25px;border:0;border-radius:7px;background:#ffffff26;color:#fff}
    .notice{max-width:1600px;margin:14px auto 0;color:var(--muted);font-size:13px}footer{position:fixed;z-index:20;right:18px;bottom:18px;left:18px;display:none;align-items:center;justify-content:space-between;gap:14px;border-radius:17px;background:#17202aea;color:#fff;padding:10px 10px 10px 16px;box-shadow:0 14px 45px #0004;backdrop-filter:blur(12px)}footer span{overflow:hidden;font-size:12px;text-overflow:ellipsis;white-space:nowrap}footer button{flex:none;background:#f2c94c;color:#332b10}
    @media(max-width:760px){main{padding:24px 14px 100px}header{align-items:flex-start;flex-direction:column}.privacy{font-size:11px}.toolbar{flex-wrap:wrap}.spacer,.toolbar .save{display:none}.btn{flex:1;padding:0 12px}.ghost{flex:0 0 auto}.editor{grid-template-columns:1fr}.guide{display:none}.gridwrap{margin-top:16px}footer{display:flex}}
  </style>
</head>
<body>
<main>
  <header><div><p class="eyebrow">IMAGE ORGANIZER</p><h1>이미지 자동 정리</h1><p class="subtitle">이미지를 표에 배치하고 끌어서 정리한 뒤, 이름을 바꿔 한 번에 저장해.</p></div><div class="privacy">모든 작업은 이 기기 안에서 처리돼</div></header>
  <section class="toolbar">
    <input id="gallery" type="file" accept="image/*" multiple hidden><input id="files" type="file" multiple hidden>
    <button class="btn primary" data-open="gallery">사진·갤러리</button><button class="btn secondary" data-open="files">파일 선택</button>
    <div class="count"><strong id="filled">0</strong> / <span id="total">9</span>장</div><div class="spacer"></div>
    <button class="btn ghost" id="clear">전체 비우기</button><button class="btn save" data-save>ZIP으로 저장</button>
  </section>
  <section class="editor">
    <label><b>분류 · 캐릭터명 (가로)</b><textarea id="categories">캐릭터 1
캐릭터 2
캐릭터 3</textarea><small>줄바꿈 또는 쉼표로 구분</small></label>
    <label><b>상황 (세로)</b><textarea id="situations">기본
기쁨
화남</textarea><small>줄바꿈 또는 쉼표로 구분</small></label>
    <div class="guide"><b>배치 순서</b><span>(0,0) → (1,0) → (2,0) → 다음 줄</span><span>이미지를 다른 칸으로 끌면 두 이미지가 서로 바뀌어.</span></div>
  </section>
  <section class="gridwrap"><div class="matrix" id="matrix"></div></section>
  <p class="notice" id="notice">분류와 상황을 입력하고 이미지를 추가해봐.</p>
  <footer><span id="mobileNotice">이미지를 추가해봐.</span><button class="btn" data-save>저장</button></footer>
</main>
<script>
  const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
  const state={images:[],drag:null};
  const parse=v=>v.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
  const safe=v=>v.replace(/[\\/:*?"<>|]/g,"_").replace(/\s+/g," ").trim()||"미지정";
  const lists=()=>({cats:parse($("#categories").value),sits:parse($("#situations").value)});
  const say=t=>{$("#notice").textContent=t;$("#mobileNotice").textContent=t};
  function swap(a,b){if(a===b||a<0||b<0)return;[state.images[a],state.images[b]]=[state.images[b],state.images[a]];render()}
  function render(){
    const {cats,sits}=lists(), count=cats.length*sits.length, grid=$("#matrix");
    $("#total").textContent=count;$("#filled").textContent=state.images.slice(0,count).filter(Boolean).length;
    grid.style.gridTemplateColumns=`108px repeat(${cats.length},190px)`;
    grid.innerHTML=`<div class="corner">상황 ↓ / 분류 →</div>`+cats.map((x,i)=>`<div class="chead"><span>${i}, x</span>${x}</div>`).join("");
    sits.forEach((sit,y)=>{
      grid.insertAdjacentHTML("beforeend",`<div class="row"><div class="rhead"><span>y, ${y}</span>${sit}</div>`+
        cats.map((cat,x)=>{const i=y*cats.length+x,item=state.images[i];return `<div class="cell" data-i="${i}">${item?`<div class="card" draggable="true" data-i="${i}"><img src="${item.url}" alt=""><div class="label"><span>${cat}_${sit}</span><button data-remove="${i}">×</button></div></div>`:`<div class="empty"><strong>${x},${y}</strong><span>빈칸</span></div>`}</div>`}).join("")+`</div>`);
    });
    bindGrid();
  }
  function bindGrid(){
    $$(".card").forEach(card=>{
      card.ondragstart=e=>{state.drag=+card.dataset.i;e.dataTransfer.setData("text/plain",state.drag);card.closest(".cell").classList.add("dragging")};
      card.ondragend=()=>{state.drag=null;render()};
      card.onpointerdown=e=>{if(e.pointerType!=="mouse"){state.drag=+card.dataset.i;card.setPointerCapture(e.pointerId)}};
      card.onpointerup=e=>{if(e.pointerType!=="mouse"){const cell=document.elementFromPoint(e.clientX,e.clientY)?.closest(".cell");if(cell)swap(state.drag,+cell.dataset.i);state.drag=null}};
    });
    $$(".cell").forEach(cell=>{cell.ondragover=e=>e.preventDefault();cell.ondrop=e=>{e.preventDefault();swap(+e.dataTransfer.getData("text/plain"),+cell.dataset.i)}});
    $$("[data-remove]").forEach(b=>b.onclick=e=>{e.stopPropagation();const i=+b.dataset.remove;URL.revokeObjectURL(state.images[i].url);state.images[i]=null;render()});
  }
  function add(input){
    const {cats,sits}=lists(),count=cats.length*sits.length, chosen=[...input.files].filter(f=>f.type.startsWith("image/"));
    state.images=Array.from({length:count},(_,i)=>state.images[i]||null);
    let n=0;for(let i=0;i<count&&n<chosen.length;i++)if(!state.images[i]){const file=chosen[n++];state.images[i]={file,url:URL.createObjectURL(file)}}
    say(`${n}장을 순서대로 배치했어.${n<chosen.length?` 빈칸이 부족해서 ${chosen.length-n}장은 제외했어.`:""}`);input.value="";render();
  }
  async function save(){
    const {cats,sits}=lists(),count=cats.length*sits.length,items=state.images.slice(0,count);if(!items.some(Boolean))return say("저장할 이미지가 없어.");
    if(!window.JSZip)return say("압축 기능을 불러오지 못했어. 인터넷 연결을 확인해줘.");
    say("압축 파일을 만드는 중...");const zip=new JSZip(),used={};
    items.forEach((item,i)=>{if(!item)return;const x=i%cats.length,y=Math.floor(i/cats.length),ext=item.file.name.includes(".")?item.file.name.split(".").pop().toLowerCase():(item.file.type.split("/").pop()||"png"),base=`${safe(cats[x])}_${safe(sits[y])}`,n=used[base]=(used[base]||0)+1;zip.file(`${base}${n>1?`_${n}`:""}.${ext}`,item.file)});
    const blob=await zip.generateAsync({type:"blob"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="이미지_정리.zip";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);say(`${items.filter(Boolean).length}장을 이름 변경해서 저장했어.`);
  }
  $$("[data-open]").forEach(b=>b.onclick=()=>$("#"+b.dataset.open).click());$("#gallery").onchange=e=>add(e.target);$("#files").onchange=e=>add(e.target);
  $("#clear").onclick=()=>{state.images.forEach(x=>x&&URL.revokeObjectURL(x.url));state.images=[];say("이미지를 전부 비웠어.");render()};
  $("#categories").oninput=render;$("#situations").oninput=render;$$("[data-save]").forEach(b=>b.onclick=save);render();
</script>
</body>
</html>
